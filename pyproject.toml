[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsbot"
version = "1.0.0"
description = "Telegram news aggregator that cleans donor posts and republishes them into one channel"
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.36,<2",
    "aiogram>=3.13,<4",
    "PyYAML>=6,<7",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
