# Один процесс: чтение доноров и публикация в целевой канал.
# Не поднимайте второй экземпляр на той же базе — будут дубли.
services:
  newsbot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONFIG_PATH: /app/config.yaml
      DATABASE_PATH: /app/data/newsbot.sqlite
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
